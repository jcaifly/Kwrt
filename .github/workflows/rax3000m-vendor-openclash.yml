name: RAX3000M vendor packages + OpenClash + Mihomo

on:
  workflow_dispatch:
  push:
    branches:
      - codex/rax3000m-vendor-openclash
    paths:
      - .github/workflows/rax3000m-vendor-openclash.yml
      - devices/rax3000m-emmc-vendor/**
      - scripts/rax3000m-vendor.sh
      - scripts/rax3000m-vendor.py
      - scripts/adapt-rax3000m-vendor.py
      - scripts/tests/test_rax3000m_vendor.py

permissions:
  contents: read

concurrency:
  group: rax3000m-vendor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUILD_JOBS: '2'
      TZ: Asia/Shanghai
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize paths
        run: |
          echo "BUILD_ROOT=$RUNNER_TEMP/rax3000m-vendor-build" >> "$GITHUB_ENV"
          echo "ARTIFACT_ROOT=$RUNNER_TEMP/rax3000m-vendor-artifacts" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/rax3000m-vendor-artifacts/diagnostics"

      - name: Checkout reviewed build sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install prerequisites
        run: |
          exec > >(tee "$ARTIFACT_ROOT/diagnostics/prerequisites.log") 2>&1
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential clang flex bison gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget curl \
            cmake ninja-build pkgconf libelf-dev libgmp-dev libmpc-dev \
            libmpfr-dev device-tree-compiler patch xz-utils zstd ripgrep

      - name: Test package mapping and core verification
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s scripts/tests -p test_rax3000m_vendor.py -v \
            2>&1 | tee "$ARTIFACT_ROOT/diagnostics/vendor-tests.log"

      - name: Prepare and verify every vendor package equivalent
        run: bash scripts/rax3000m-vendor.sh prepare "$BUILD_ROOT" "$ARTIFACT_ROOT"

      - name: Build and verify single-device firmware with Mihomo
        timeout-minutes: 340
        run: bash scripts/rax3000m-vendor.sh build "$BUILD_ROOT" "$ARTIFACT_ROOT"

      - name: Upload firmware and verification records
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rax3000m-vendor-mihomo-firmware-${{ github.run_id }}
          path: ${{ env.ARTIFACT_ROOT }}/firmware/
          if-no-files-found: error
          retention-days: 30

      - name: Upload matching signed packages
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rax3000m-vendor-matching-packages-${{ github.run_id }}
          path: ${{ env.ARTIFACT_ROOT }}/matching-packages/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rax3000m-vendor-diagnostics-${{ github.run_id }}
          path: |
            ${{ env.ARTIFACT_ROOT }}/diagnostics/
            ${{ env.ARTIFACT_ROOT }}/bootstrap/diagnostics/
          if-no-files-found: warn
          retention-days: 30
