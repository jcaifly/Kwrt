name: Newifi D2 OpenClash (no core)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newifi-d2-openclash-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TZ: UTC
      BUILD_JOBS: '2'
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize build paths
        run: |
          echo "BUILD_ROOT=$RUNNER_TEMP/newifi-d2-build" >> "$GITHUB_ENV"
          echo "ARTIFACT_ROOT=$RUNNER_TEMP/newifi-d2-artifacts" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/newifi-d2-artifacts/diagnostics"

      - name: Checkout Kwrt
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install build prerequisites
        run: |
          exec > >(tee "$ARTIFACT_ROOT/diagnostics/prerequisites.log") 2>&1
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential clang flex bison gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget curl \
            cmake ninja-build pkgconf libelf-dev libgmp-dev libmpc-dev \
            libmpfr-dev device-tree-compiler patch xz-utils zstd ripgrep
          df -h

      - name: Prepare pinned sources and check the final single-device config
        run: bash scripts/newifi-d2-openclash.sh prepare "$BUILD_ROOT" "$ARTIFACT_ROOT"

      - name: Build and verify Newifi D2 firmware
        timeout-minutes: 300
        run: bash scripts/newifi-d2-openclash.sh build "$BUILD_ROOT" "$ARTIFACT_ROOT"

      - name: Upload verified firmware and metadata
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: newifi-d2-openclash-firmware-${{ github.run_id }}
          path: ${{ env.ARTIFACT_ROOT }}/firmware/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: newifi-d2-openclash-diagnostics-${{ github.run_id }}
          path: ${{ env.ARTIFACT_ROOT }}/diagnostics/
          if-no-files-found: warn
          retention-days: 30
